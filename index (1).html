<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>抓坏猫</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="app">

  <header id="hud">
    <div class="hud-file">
      <span class="file-tag">案件</span>
      <span class="file-no" id="levelNo">第 1 号</span>
      <span class="file-sep"></span>
      <span class="file-tag">漏网</span>
      <span class="file-num" id="escapeNum">0</span>
      <span class="file-grow"></span>
      <span class="file-tag">分数</span>
      <span class="file-num file-score" id="scoreNum">0</span>
    </div>

    <div class="warrant">
      <div class="warrant-head">
        <span class="warrant-word">通缉</span>
        <span class="warrant-target" id="targetText">猫大王 ×1</span>
        <span class="warrant-dots" id="targetDots"></span>
      </div>
      <div class="warrant-time">
        <div class="time-bar"><i id="timeFill"></i></div>
        <span class="time-text" id="timeText">1:30</span>
      </div>
    </div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <div id="toast" class="toast"></div>

  <section id="overlay" class="overlay">

    <div class="screen" id="screenStart">
      <p class="brand-sub">夜间巡逻 · 第一班</p>
      <h1 class="brand">抓坏猫</h1>
      <div class="brief">
        <p>戴眼罩的坏猫正从传送带溜过去。</p>
        <p>点它，它就进押解笼。</p>
        <p>笼里凑齐三只同款同级，会合成更高一级。</p>
        <p>合出<b>猫大王</b>，当场盖章逮捕。</p>
      </div>
      <button type="button" class="btn btn-main" id="btnStart">开始抓捕</button>
      <p class="best">最高分 <span id="bestStart">0</span></p>
    </div>

    <div class="screen" id="screenEnd" hidden>
      <div class="verdict" id="verdictMark">结案</div>
      <h2 class="end-title" id="endTitle">全部落网</h2>
      <p class="end-note" id="endNote">猫大王已收押。</p>
      <dl class="tally" id="tally"></dl>
      <button type="button" class="btn btn-main" id="btnAgain">再抓一次</button>
      <p class="best">最高分 <span id="bestEnd">0</span></p>
    </div>

  </section>

</div>

<script src="./app.js"></script>
</body>
</html>
